name: billing-mvp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing}
    ports:
      - "127.0.0.1:${DB_PORT:-5453}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing} -d ${POSTGRES_DB:-billing_mvp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-billing_mvp}
      DB_USER: ${POSTGRES_USER:-billing}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-billing}
      DATAREON_SERVICE_ORDER_URL: ${DATAREON_SERVICE_ORDER_URL:-}
      DATAREON_USERNAME: ${DATAREON_USERNAME:-}
      DATAREON_PASSWORD: ${DATAREON_PASSWORD:-}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3021}
      SPRING_PROFILES_ACTIVE: dev
      OPERATIONAL_RESET_ENABLED: ${OPERATIONAL_RESET_ENABLED:-true}
      OPERATIONAL_RESET_BACKUP_DIR: /app/reset-backups
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8101}:8080"
    volumes:
      - ./backups/ui-resets:/app/reset-backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3021}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
